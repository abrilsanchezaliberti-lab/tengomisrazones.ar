<script type="application/json" id="notas">[{"id":"02e1poj4ge8fw9bnksik","actualizado":"2026-11-17T00:35:13.320Z","bajada":"Porque vivir mejor también debería significar tener tiempo para vivir.","creado":"2026-11-16T15:00:00.000Z","formato":"librito","sinFecha":true,"texto":"Lucía tiene 22 años. Estudia en la universidad y trabaja por la tarde en un comercio de La Plata.\n\nSon las siete de la mañana y todavía no llegó el colectivo.\n\n«Si camino estas veinte cuadras, me ahorro un boleto».\n\nHace las cuentas en la cabeza. Si sale un poco antes, puede caminar hasta la facultad. Si lleva comida de su casa, no tiene que comprar nada. Si este cuatrimestre cursa una materia menos, quizás pueda sumar otro turno de trabajo.\n\nHace semanas que no ve a sus amigas.\n\n«El sábado nos juntamos, sí o sí», escribe en el grupo.\n\nEs la tercera vez que lo dice.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nRoberto tiene 57 y hace treinta que levanta la persiana del mismo negocio en Pergamino.\n\nAntes conocía a sus clientes por las conversaciones y ahora los conoce por las cuentas que les quedan pendientes.\n\nMira los números de la semana.\n\n«No llego».\n\nVuelve a sumar.\n\n«No llego».\n\nSu mujer le pregunta si consiguió turno con el médico. Le duele la espalda desde hace meses.\n\n«La semana que viene voy».\n\nSabe que probablemente no vaya.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nMariana tiene 43 y enseña en una universidad de Córdoba. Hace quince años que da clases y todavía le gusta ese momento en que alguien levanta la mano para preguntar algo que ella no había pensado.\n\nPero ahora tiene otro trabajo. Prepara clases los domingos y responde mensajes mientras viaja.\n\nUna compañera le escribe para tomar algo después de la clase.\n\n«Hoy no puedo, estoy muerta».\n\nAntes de dormir se acuerda de que tampoco le respondió el mensaje a su hermana.\n\n«Cómo estará? Hace un montón que no hablamos».\n\nPiensa en llamarla mañana.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nErnesto tiene 49 años y vive en Neuquén. De chico acompañaba a su papá por los caminos del campo.\n\nHay lugares que todavía reconoce por un árbol, una curva o una tranquera vieja. Otros cambiaron tanto que le cuesta ubicarlos.\n\nUna tarde toma un camino que hacía años que no recorría. Un alambrado nuevo le impide seguir.\n\n«Mirá vos, por acá pasábamos siempre».\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nSofía tiene 19 años y vive en Rosario. Es la primera de su familia en ir a la universidad.\n\nEl día que se inscribió, sus padres sacaron fotos, llamaron a los abuelos y festejaron como si ya se hubiese recibido.\n\nAhora está buscando trabajo.\n\n«Si consigo algo de cuatro horas, puedo seguir cursando».\n\nDespués mira los horarios.\n\n«Bueno, capaz dejo una materia».\n\nNo quiere decirles nada a sus papas. Sabe cuánto se alegraron cuando empezó la carrera.\n\n\n—\n\nDaniel en cambio tiene 38 y trabaja en una oficina pública.\n\nSu hermana tiene una discapacidad y necesita tratamientos y acompañamiento. En su familia conocen bien los llamados, las autorizaciones y las horas de espera.\n\nEn el trabajo también hay menos compañeros y más cosas para resolver.\n\nLlega a su casa agotado.\n\nSu hijo le muestra un dibujo y le pregunta si pueden jugar.\n\n«Dame diez minutos y voy».\n\nCuando levanta la vista, el nene ya está dormido.\n\nSe queda mirando el dibujo un rato.\n\n⸻\n\n\n\n\n\n\nSon seis personas que probablemente nunca se hayan cruzado.\n\nTienen edades distintas, trabajos diferentes y maneras propias de entender lo que pasa en el país. Seguramente tampoco votaron todos lo mismo.\n\nPero hay algo que se repite en sus historias.\n\n«No llego».\n\nNo llego con la plata. No llego con el tiempo. No llego a estudiar. No llego a descansar. No llego a ver a mis amigos y no llego a estar con mi familia.\n\nEn qué momento empezamos a vivir haciendo cuentas sobre todo lo que tenemos que dejar para después?\n\nNos acostumbramos a hablar del futuro como si fuera una responsabilidad individual. Estudiar, trabajar, progresar, construir una vida.\n\nPero cuánto de ese futuro depende realmente de nuestras decisiones?\n\nTrabajamos para sostener una vida que cada vez tenemos menos tiempo de disfrutar. Estudiamos para conseguir mejores oportunidades, pero necesitamos trabajar tanto que terminamos postergando nuestra formación.\n\nDejamos de ver a nuestros amigos, de hacer actividad física, de descansar, de compartir una comida sin estar pendientes de lo que tenemos que hacer después.\n\nY cuando no llegamos a todo, pensamos que nos falta organización.\n\n«Tengo que levantarme más temprano».\n\n«Tengo que aprovechar mejor el día».\n\n«Tengo que hacer algo más».\n\nSiempre algo más.\n\nPero, y si el problema no fuera solamente cómo organizamos nuestras vidas, sino las condiciones en las que intentamos vivirlas?\n\n\n\n\n\nEl cansancio, la ansiedad, el malestar físico y la tristeza no pueden explicarse únicamente desde lo individual. No todas las personas viven estas situaciones de la misma manera, pero tampoco podemos desconocer que la incertidumbre económica, las condiciones de trabajo y la falta de tiempo afectan nuestra salud y nuestros vínculos.\n\nTenemos menos paciencia, menos tiempo para escuchar, menos energía para encontrarnos.\n\nNos enojamos más fácilmente. Discutimos por cosas pequeñas. A veces dejamos de responder mensajes porque no sabemos qué decir o porque no tenemos ganas de hablar con nadie.\n\n«Después le escribo».\n\n«La semana que viene nos vemos».\n\n«Cuando esté más tranquilo».\n\nY así pasan los días.\n\nQuizás una de las consecuencias más difíciles de reconocer sea esa: que empezamos a vivir problemas compartidos como si fueran fracasos individuales.\n\n⸻\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nEn diciembre del 2023, el Gobierno nacional dictó el DNU 70/2023, que modificó numerosas leyes y regulaciones bajo una propuesta de desregulación económica.\nEntre sus disposiciones incluyó la derogación de la Ley de Tierras, que establecía límites a la adquisición de tierras rurales por parte de extranjeros.\nMientras tanto, \nla universidad pública enfrenta una disputa por su financiamiento, \nlas familias intentan sostener sus gastos y deudas, \ny las personas con discapacidad y quienes las acompañan reclaman que se garanticen sus derechos y prestaciones.\nSon discusiones diferentes, pero tienen algo en común: nos obligan a preguntarnos quién decide sobre las condiciones en las que vivimos.\nLa tierra es producción, trabajo, recursos y comunidades. La universidad pública conocimiento, investigación y oportunidades que una generación construye para las siguientess. Y los sistemas de salud y de cuidado son parte de una sociedad incluso cuando no necesitamos recurrir a ellos.\nNo todo lo que construimos colectivamente tiene que beneficiarnos de manera inmediata para ser importante.\nNo todas las formas de perder soberanía implican perder territorio. También podemos perder capacidad de decidir cuando dejamos de producir conocimiento propio, cuando renunciamos a planificar nuestros recursos o cuando las posibilidades de construir una vida dependen cada vez más del dinero que tiene cada persona.\nNo se trata de creer que todo lo que hace el Estado está bien ni de rechazar cualquier inversión privada. Se trata de reconocer que hay decisiones que afectan a muchas más personas que a quienes las toman.\nY que esas decisiones deberían poder discutirse entre todos.\n\n\n\n\n\nEl 15 de octubre, algunas de esas discusiones llegan al Congreso. Otras continúan en distintos lugares del país.\nLucía sale de trabajar con sus apuntes en la mochila. Una compañera le pregunta si va a ir.\nMira la hora.\n«Si salimos ahora, llegamos».\nMariana termina de dar clases en Córdoba. Esta vez deja los correos sin responder y se encuentra con otros docentes y estudiantes.\nSofía se reúne con sus compañeros en Rosario. Una amiga le cuenta que también está pensando en dejar una materia para trabajar. Se quedan hablando un rato.\nDaniel va al Congreso con un cartel que hizo junto a su hermana. Ahí conoce a otras familias que llevan meses esperando respuestas parecidas.\nErnesto conversa con un vecino sobre la Ley de Tierras.\n\nRoberto no marcha.\nTiene el negocio abierto y varias cuentas por pagar. Durante la mañana, un cliente le cuenta que está pensando en cerrar el suyo.\n«Y qué vas a hacer?», le pregunta.\n«No sé, Roberto. No sé».\nSe quedan conversando un rato. Ninguno tiene demasiado para aconsejarle al otro.\nNo todos están en la misma plaza. Ni siquiera todos participan de una movilización.\nPero sus historias tienen más puntos en común de los que probablemente imaginan.\nY quizás por eso una jornada como la del 15 importa.\nNo porque una marcha vaya a resolver todos los problemas, ni porque quienes participan tengan necesariamente las mismas ideas.\nSino porque nos permite reconocer que muchas de las cosas que nos pasan también les pasan a otros.\nQuizás lo importante sea que nuestras preocupaciones dejen de ser solamente nuestras.\nQue podamos conversar, discutir, organizarnos y volver a mirar lo que les pasa a los demás.\nPorque cuando estamos demasiado ocupados intentando resolver nuestros propios problemas, también se vuelve más difícil reconocer lo que compartimos.\n\nMe interesa contar estas historias porque las leyes, la economía y las decisiones políticas no ocurren lejos de nuestra vida cotidiana.\nEstán en las materias que dejamos, los turnos médicos que postergamos, las cuentas que no podemos pagar y el tiempo que ya no tenemos para compartir.\nY me preocupa que terminemos acostumbrándonos a eso.\nQue el cansancio se vuelva normal, que siempre haya algo más urgente que hacer y que empecemos a creer que, si no llegamos, es porque no nos esforzamos lo suficiente.\nQuizás defender lo que tenemos en común tenga que ver con eso.\nCon recuperar la posibilidad de imaginar una vida que no esté organizada únicamente alrededor de la necesidad de sobrevivir.\nNo sé si alguna vez vamos a dejar de hacer cuentas, de llegar tarde o de tener cosas pendientes.\nPero me gustaría que pudiéramos pensar el futuro sin sentir que tenemos que resolverlo todo solos.\nQue llegar a fin de mes no nos cueste todos los días del mes.\nQue podamos preguntarle a alguien cómo está y tener tiempo para escuchar su respuesta.\nY que, cuando volvamos a decir «no llego», exista también la posibilidad de preguntarnos a dónde queremos llegar. Y con quiénes.\nPorque vivir mejor también debería significar tener tiempo para vivir.\n\n\n\n\n\n\n\n\n\n\n\nY que, cuando volvamos a decir “no llego”, exista también la posibilidad de preguntarnos a dónde queremos llegar. \n\nY con quiénes","tipo":"Postdata.","titulo":"no llego"},{"id":"7wdasd74vkfenwkugv6h","actualizado":"2026-11-20T18:11:37.352Z","creado":"2026-11-20T15:00:00.000Z","sinFecha":true,"texto":"Un nene le preguntó a su papá si los perros sabían que eran perros.","tipo":"Escuché en la calle","titulo":"en el parque"},{"id":"8sfi9plwson6irgsrhs2","actualizado":"2026-11-16T18:39:13.672Z","bajada":"JULIÁN LLAMAME","creado":"2026-11-16T18:35:49.108Z","mails":[{"cuerpo":"Necesito que me llames y finjas que pasó algo grave.\n\nEstoy en una cita y el tipo acaba de decir que no cree en los dinosaurios.\n\nNo sé cómo llegamos a este tema.\n\nPor favor llamame.","de":"Clara","fecha":"","para":"Julian"},{"cuerpo":"Pero cree que no existieron o que siguen vivoss?","de":"Julian","fecha":"","para":"Clara"},{"cuerpo":"JULIÁN LLAMAME.","de":"Clara","fecha":"","para":"Julian"},{"cuerpo":"Es importante saberlo.","de":"Julian","fecha":"","para":"Clara"},{"cuerpo":"Dice que los huesos los pusieron los museos.","de":"Clara","fecha":"","para":"Julian"},{"cuerpo":"Quedate un rato más. Quiero saber qué opina de las jirafas.","de":"Julian","fecha":"","para":"Clara"}],"texto":"Necesito que me llames y finjas que pasó algo grave.\n\nEstoy en una cita y el tipo acaba de decir que no cree en los dinosaurios.\n\nNo sé cómo llegamos a este tema.\n\nPor favor llamame.\n\nPero cree que no existieron o que siguen vivoss?\n\nJULIÁN LLAMAME.\n\nEs importante saberlo.\n\nDice que los huesos los pusieron los museos.\n\nQuedate un rato más. Quiero saber qué opina de las jirafas.","tipo":"Correspondencia ajena","titulo":"Urgente"},{"id":"8t2pkbohz35oshrft675","actualizado":"2026-11-16T20:05:10.116Z","bajada":"Las cosas que hacemos juntos","comentarios":[{"nombre":"","texto":"Hermoso y te digo que me veo reflejada ! Marcela"}],"creado":"2026-11-16T20:05:10.116Z","destacada":true,"mails":[{"cuerpo":"No sé por qué te estoy escribiendo si vivimos en la misma casa.\n\nSupongo que porque ayer, cuando intenté explicarte lo que me pasaba, terminamos discutiendo sobre algo que no tenía nada que ver. Vos decías que yo nunca estaba conforme con nada y yo te dije que últimamente me daba la impresión de que hacíamos todo por inercia.\n\nNo quise decir que no te quiero.\n\nPero me preocupa que cada vez que digo que algo de nuestra relación no me gusta, vos entiendas que estoy cuestionando toda nuestra relación.\n\nEl domingo me preguntaste qué quería hacer y te dije que nada. Me dijiste que bueno, que nos quedáramos en casa. Y me enojé.\n\nYa sé. Es bastante difícil convivir conmigo cuando ni siquiera yo sé qué quiero.\n\nPero me parece que hace tiempo dejamos de preguntarnos cosas de verdad. Nos preguntamos qué vamos a comer, si pagamos la luz, si hay ropa para lavar. No sé cuándo fue la última vez que me preguntaste algo que no supieras de mí.\n\nY yo tampoco te pregunto.\n\nNo quiero que me contestes que tenemos que salir más o hacer algún viaje. No estoy hablando de eso.\n\nCreo que me da miedo que nos conozcamos tanto que un día ya no tengamos curiosidad.","de":"Cata","fecha":"","para":"Fran"},{"cuerpo":"\nMe parece injusto que digas que no te pregunto cosas.\n\nEl domingo te pregunté qué querías hacer. Me dijiste que nada. Después te enojaste porque no hice nada.\n\nNo sé qué esperás de mí cuando hacés eso.\n\nY no es que no entienda lo que decís. A mí también me pasa que a veces siento que vivimos repitiendo los mismos días. Pero no creo que eso sea necesariamente malo.\n\nHay algo que me gusta de saber que los jueves llegás tarde y que si te guardo comida te vas a poner contenta. Me gusta no tener que preguntarte todo el tiempo cómo estás para darme cuenta de que tuviste un día de mierda.\n\nA veces pienso que vos confundís la tranquilidad con el aburrimiento.\n\nY que cada tanto necesitás encontrar un problema para comprobar que todavía nos importa resolverlo.\n\nNo sé si es justo que te diga eso, pero es lo que pienso.","de":"Fran","fecha":"","para":"Cata"},{"cuerpo":"Lo leí tres veces.\n\nLa primera me enojé. La segunda también.\n\nLa tercera pensé que quizás tenías razón en algunas cosas.\n\nMe quedé pensando en eso que dijiste de que te gusta saber cómo estoy sin preguntarme. A mí también me gusta que me conozcas. Muchísimo.\n\nPero hay algo que me hace ruido.\n\nPorque a veces no estoy como vos creés que estoy. Y cuando intento explicártelo, siento que tengo que discutir contra una versión de mí que vos ya tenés bastante resuelta.\n\nEl otro día me dijiste que yo siempre necesito tener planes. Lo dijiste como si fuera una característica mía que ya no pudiera cambiar. Como si estuviera condenada a ser la misma persona que era cuando nos conocimos.\n\nY capaz que no quiero hacer nada.\n\nCapaz que quiero aburrirme.\n\nO capaz que quiero aburrirme con vos, pero de otra manera.\n\nNo sé si se entiende.","de":"Cata","fecha":"","para":"Fran"},{"cuerpo":"Se entiende.\n\nAunque hay algo que no te dije.\n\nA veces siento que si no estamos haciendo algo interesante, vos pensás que estamos desperdiciando el tiempo.\n\nY a mí me gusta perder el tiempo con vos.\n\nNo sé cómo explicarlo sin que suene a una de esas frases horribles que ponen en las tazas.\n\nPero me gusta.\n\nAyer, mientras vos estabas escribiendo esto, yo estaba en la cocina esperando que terminara de hervir el agua. Me preguntaste si quería mate. Te dije que sí. Después me contaste una cosa de tu trabajo y te reíste sola antes de terminar de contarla.\n\nNo sé si eso alcanza para lo que vos querés de una pareja.\n\nPara mí, ayer alcanzó.\n\nIgual tenemos que hablar de lo otro. Y comprar yerba.","de":"Fran","fecha":"","para":"Cata"}],"texto":"No sé por qué te estoy escribiendo si vivimos en la misma casa.\n\nSupongo que porque ayer, cuando intenté explicarte lo que me pasaba, terminamos discutiendo sobre algo que no tenía nada que ver. Vos decías que yo nunca estaba conforme con nada y yo te dije que últimamente me daba la impresión de que hacíamos todo por inercia.\n\nNo quise decir que no te quiero.\n\nPero me preocupa que cada vez que digo que algo de nuestra relación no me gusta, vos entiendas que estoy cuestionando toda nuestra relación.\n\nEl domingo me preguntaste qué quería hacer y te dije que nada. Me dijiste que bueno, que nos quedáramos en casa. Y me enojé.\n\nYa sé. Es bastante difícil convivir conmigo cuando ni siquiera yo sé qué quiero.\n\nPero me parece que hace tiempo dejamos de preguntarnos cosas de verdad. Nos preguntamos qué vamos a comer, si pagamos la luz, si hay ropa para lavar. No sé cuándo fue la última vez que me preguntaste algo que no supieras de mí.\n\nY yo tampoco te pregunto.\n\nNo quiero que me contestes que tenemos que salir más o hacer algún viaje. No estoy hablando de eso.\n\nCreo que me da miedo que nos conozcamos tanto que un día ya no tengamos curiosidad.\n\n\nMe parece injusto que digas que no te pregunto cosas.\n\nEl domingo te pregunté qué querías hacer. Me dijiste que nada. Después te enojaste porque no hice nada.\n\nNo sé qué esperás de mí cuando hacés eso.\n\nY no es que no entienda lo que decís. A mí también me pasa que a veces siento que vivimos repitiendo los mismos días. Pero no creo que eso sea necesariamente malo.\n\nHay algo que me gusta de saber que los jueves llegás tarde y que si te guardo comida te vas a poner contenta. Me gusta no tener que preguntarte todo el tiempo cómo estás para darme cuenta de que tuviste un día de mierda.\n\nA veces pienso que vos confundís la tranquilidad con el aburrimiento.\n\nY que cada tanto necesitás encontrar un problema para comprobar que todavía nos importa resolverlo.\n\nNo sé si es justo que te diga eso, pero es lo que pienso.\n\nLo leí tres veces.\n\nLa primera me enojé. La segunda también.\n\nLa tercera pensé que quizás tenías razón en algunas cosas.\n\nMe quedé pensando en eso que dijiste de que te gusta saber cómo estoy sin preguntarme. A mí también me gusta que me conozcas. Muchísimo.\n\nPero hay algo que me hace ruido.\n\nPorque a veces no estoy como vos creés que estoy. Y cuando intento explicártelo, siento que tengo que discutir contra una versión de mí que vos ya tenés bastante resuelta.\n\nEl otro día me dijiste que yo siempre necesito tener planes. Lo dijiste como si fuera una característica mía que ya no pudiera cambiar. Como si estuviera condenada a ser la misma persona que era cuando nos conocimos.\n\nY capaz que no quiero hacer nada.\n\nCapaz que quiero aburrirme.\n\nO capaz que quiero aburrirme con vos, pero de otra manera.\n\nNo sé si se entiende.\n\nSe entiende.\n\nAunque hay algo que no te dije.\n\nA veces siento que si no estamos haciendo algo interesante, vos pensás que estamos desperdiciando el tiempo.\n\nY a mí me gusta perder el tiempo con vos.\n\nNo sé cómo explicarlo sin que suene a una de esas frases horribles que ponen en las tazas.\n\nPero me gusta.\n\nAyer, mientras vos estabas escribiendo esto, yo estaba en la cocina esperando que terminara de hervir el agua. Me preguntaste si quería mate. Te dije que sí. Después me contaste una cosa de tu trabajo y te reíste sola antes de terminar de contarla.\n\nNo sé si eso alcanza para lo que vos querés de una pareja.\n\nPara mí, ayer alcanzó.\n\nIgual tenemos que hablar de lo otro. Y comprar yerba.","tipo":"Correspondencia ajena","titulo":"lo del domingo"},{"id":"con-anticipacion","actualizado":"2026-11-20T20:14:54.010Z","creado":"2026-11-20T20:14:54.010Z","texto":"Buen día, te escribimos del consultorio para recordarte que tenés turno mañana a las 9.30. Si no podés asistir, por favor avisá con anticipación.","tipo":"Me escribieron","titulo":"Con anticipación"},{"id":"dejalo-ahi-que-despues-lo-guardo","actualizado":"2026-11-18T23:17:22.901Z","creado":"2026-11-18T23:17:22.901Z","texto":"—Ma, vos viste una caja de zapatos que estaba arriba del placard?\n\n—Cuál?\n\n—Una marrón. Medio rota, que tenía unas cosas mías.\n\n—Ah, sí. La tiré.\n\n—Cómo que la tiraste?\n\n—Y estaba toda rota, hija.\n\n—Pero tenía cosas adentro.\n\n—Unos papeles tenía.\n\n—No eran unos papeles.\n\n—Bueno, qué sé yo. Estuve ordenando toda la tarde.\n\n—Pero no me podés preguntar antes?\n\n—Ay, bueno, tampoco sabía que la necesitabas.\n\n—No es que la necesitaba. Tenía cosas mías ahí.\n\n—Bueno, no me hables así.\n\n—Cómo te estoy hablando?\n\n—Así, como me hablás siempre cuando algo no te gusta.\n\n—Pero me estás diciendo que tiraste una caja mía.\n\n—Y vos me estás hablando como si lo hubiera hecho a propósito.\n\n—No dije que lo hiciste a propósito.\n\n—Bueno.\n\nLa madre abrió un cajón, sacó dos repasadores y volvió a cerrarlo.\n\n—Te dije que el fin de semana iba a ordenar.\n\n—Sí, ya sé. Hace tres fines de semana que me decís lo mismo.\n\n—Porque no tuve tiempo.\n\n—Yo tampoco tengo tiempo. Hoy me pasé toda la tarde limpiando.\n\n—Bueno, pero no tenías que limpiar mis cosas.\n\n—Y qué querés que haga? Que deje todo como está?\n\n—Lo mío, sí.\n\n—Pero está en mi casa.\n\n—Bueno, ya sé que es tu casa.\n\n—Y bueno.\n\n—No hace falta que me lo recuerdes.\n\n—Ay, por favor, ahora resulta que te estoy echando.\n\n—No, no dije eso.\n\n—Bueno, pero parece.\n\n—Bueno, pero no las toques.\n\n—Qué cosa?\n\n—Mis cosas, ma. De qué estamos hablando?\n\n—Bueno, listo. No toco más nada. Que se junte todo.\n\n—Ves??? se puede hablar con vos.\n\n—Ah, ahora no se puede hablar conmigo.\n\n—No, dejá. No importa.\n\n—No, ahora decime.\n\n—Que no importa.\n\n—Bueno, pero después no digas que no hablamos.\n\n—Me tiraste una caja y estamos discutiendo si hablamos o no hablamos.\n\n—Bueno, qué había tan importante?\n\n—Fotos. Y unas cartas.\n\n—Pero esa caja estaba toda abierta de un costado.\n\n—Qué tiene que ver?\n\n—Que se te iban a terminar perdiendo igual.\n\n—Bueno, pero las perdí porque vos las tiraste.\n\n—Y qué fotos eran?\n\n—Mías, de cuando era chica. Las que tenía separadas.\n\n—Ah, las que estaban en un sobre?\n\n—Sí. Esas.\n\n—Pero yo vi unos papeles nomás.\n\n—Bueno, estaban ahí.\n\n—No me acuerdo de haber visto fotos.\n\n—Y bueno, no sé qué decirte.\n\n—Esa caja estaba horrible igual. No sé por qué guardás todo en cajas de zapatos.\n\n—Porque estaban ahí, mamá.\n\n—Bueno, si eran tan importantes...\n\n—No, no me digas que las tendría que haber guardado en otro lado.\n\n—Bueno, pero es verdad.\n\nLa madre fue hasta la cocina y apagó el fuego de una olla.\n\n—Comiste vos?\n\n—No.\n\n—Hay arroz si querés.\n\n—No quiero arroz.\n\n—Bueno, te digo porque después decís que no hay nada.\n\n—Podemos hablar de la caja?\n\n—Estamos hablando de la caja.\n\n—Bueno, entonces.\n\n—Qué?\n\n—Nada. Dónde está la bolsa?\n\n—La saqué afuera.\n\n—Hace mucho?\n\n—Y... cuando terminé de limpiar. No sé qué hora era.\n\n—Bueno, voy a buscarla.\n\n—Ahora vas a salir?? Con esta lluvia?\n\n—Sí, antes de que pase el camión.\n\n—Bueno, ponete las zapatillas. No vas a salir en medias.\n\n—Ya sé, ma. Tengo treinta y dos años.\n\n—Bueno, qué tiene que ver? Te estoy diciendo que está mojado.\n\nFue hasta la entrada y se sentó en el escalón para ponérselas.\n\n—Y cuando vuelvas no me pises todo, que recién terminé de pasar el trapo.\n\n—Bueno, todavía no salí.\n\n—Te aviso para después.\n\n—Bueno.\n\n—Porque después entrás y ni te fijás.\n\n—Bueno, mamá.\n\n—Igual fijate bien porque saqué como cuatro bolsas —le dijo la madre desde la cocina.\n\n—Sí.\n\n—La de la caja era una negra, grande.\n\n—Bueno.\n\n—Y ojo cuando la abras, que tiré un vaso roto también.\n\n—Bueno, mamá.\n\nCuando abrió la puerta escuchó el camión. Estaba a unos metros, todavía en la cuadra.\n\nSalió corriendo, pero llegó justo para ver cómo la última bolsa caía adentro. El compactador se cerró sobre todas las bolsas juntas.\n\nSe quedó mirando. El camión arrancó y dobló en la esquina.\n\nVolvió a entrar.\n\n—No llegaste?\n\n—No.\n\n—Pero estaba recién ahí.\n\n—Sí, ya sé.\n\n—Y no le pudiste decir que esperara?\n\n—No, ya la habían aplastado.\n\n—Ay, no.\n\n—La vi cómo la aplastaban.\n\n—Bueno, pero alguna copia de las fotos debe haber.\n\n—No. No hay copias.\n\n—Capaz que yo tengo algunas.\n\n—Y las cartas? También tenés las cartas???\n\nLa madre dejó de acomodar las cosas de la mesada.\n\n—Bueno, no sabía que había todo eso.\n\n—Pero no tenías que saber. No tenías que tirar nada.\n\n—Ya sé. Perdoname.\n\n—Siempre hacés lo mismo.\n\n—Bueno, tampoco siempre.\n\n—No, bueno, tenés razón.\n\n—No te estoy diciendo que tenga razón.\n\n—Bueno, entonces dejá de discutir!\n\nLa madre se quedó callada.\n\n—Esa caja estaba ahí hace meses. Meses. Ni la tocaba.\n\n—Bueno, por eso pensé...\n\n—Pero qué importa lo que pensaste!!!\n\nQuiso decirle algo más, pero se puso a llorar.\n\n—La puta madre —dijo, secándose la cara con la manga.\n\n—Ay, vení.\n\n—No, dejame.\n\n—Bueno.\n\nSe quedó al lado, sin tocarla.\n\n—Eran todas mis fotos —y volvió a llorar.\n\n—Ya sé, mi amor. Perdoname.\n\nEsta vez se dejó abrazar. Se quedó un rato con los brazos caídos hasta que terminó abrazándola también.\n\n—Después buscamos, que capaz tengo algunas en un cajón.\n\n—No","tipo":"Tengo mis razones","titulo":"Dejalo ahí que después lo guardo"},{"id":"e8pt0jzunjw7utb31wbu","actualizado":"2026-11-20T18:16:31.881Z","creado":"2026-11-20T15:00:00.000Z","sinFecha":true,"texto":"—Llevamos detergente??\n\n—Hay.\n\n—Cuánto?\n\n—No sé, pero hay.\n\n—Bueno, yo llevo igual","tipo":"Escuché en la calle","titulo":"super"},{"id":"el-que-termina-el-hielo","actualizado":"2026-11-20T20:09:41.364Z","creado":"2026-11-20T20:09:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"El que termina el hielo, hace más"},{"id":"esta-conversacion-fue-eliminada","actualizado":"2026-11-20T20:03:41.364Z","creado":"2026-11-20T20:03:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"Esta conversación fue eliminada"},{"id":"esto-no-entra-en-el-parcial","actualizado":"2026-11-20T20:06:41.364Z","creado":"2026-11-20T20:06:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"Esto no entra en el parcial"},{"id":"fragil-libros-no-se","actualizado":"2026-11-20T20:05:41.364Z","creado":"2026-11-20T20:05:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"FRÁGIL / LIBROS / NO SÉ"},{"id":"gracias-por-su-comprension","actualizado":"2026-11-20T20:00:41.364Z","creado":"2026-11-20T20:00:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"Gracias por su comprensión"},{"id":"irt0wn2qjrazyk3y67gf","actualizado":"2026-11-20T18:13:27.725Z","creado":"2026-11-20T15:00:00.000Z","sinFecha":true,"texto":"—Hace mucho que esperás?\n\n—Desde antes de que llegara toda esta gente.","tipo":"Escuché en la calle","titulo":"esperás"},{"id":"jffvshykl3y6t11fvgjx","actualizado":"2026-11-16T19:59:50.732Z","bajada":"Todas las cosas que no aprendí.","comentarios":[],"creado":"2026-11-16T19:59:50.732Z","mails":[{"cuerpo":"Se me murió la planta que me diste.\n\nNo sé cómo pasó.\n\nLa regué como me dijiste, la puse cerca de la ventana y hasta le hablé un par de veces porque una compañera del trabajo dice que sirve.\n\nSe murió igual.\n\nMe acordé de que cuando era chica vos tenías plantas por todos lados. En la cocina, en el patio, arriba de la heladera. Algunas las habías sacado de gajos que encontrabas caminando.\n\nYo nunca pude mantener viva ninguna.\n\nTampoco aprendí a coser ni a hacer ese budín de mandarina que preparabas los domingos.\n\nA veces me da un poco de tristeza pensar en todas las cosas que sabés hacer y que yo no aprendí.\n\nEl otro día quise arreglar un botón y terminé llevándolo a una modista.\n\nMe cobró una fortuna. Que hija de puta\n\nMe gustaría que algún día me enseñes a hacer el budín.\n\nLo de las plantas ya lo doy por perdido.","de":"Marina","fecha":"","para":"Mamá"},{"cuerpo":"El budín es de caja.\n\nLe pongo ralladura de mandarina para que parezca casero.\n\nNo le digas a tu hermano.","de":"Mamá","fecha":"","para":"Marina"}],"texto":"Se me murió la planta que me diste.\n\nNo sé cómo pasó.\n\nLa regué como me dijiste, la puse cerca de la ventana y hasta le hablé un par de veces porque una compañera del trabajo dice que sirve.\n\nSe murió igual.\n\nMe acordé de que cuando era chica vos tenías plantas por todos lados. En la cocina, en el patio, arriba de la heladera. Algunas las habías sacado de gajos que encontrabas caminando.\n\nYo nunca pude mantener viva ninguna.\n\nTampoco aprendí a coser ni a hacer ese budín de mandarina que preparabas los domingos.\n\nA veces me da un poco de tristeza pensar en todas las cosas que sabés hacer y que yo no aprendí.\n\nEl otro día quise arreglar un botón y terminé llevándolo a una modista.\n\nMe cobró una fortuna. Que hija de puta\n\nMe gustaría que algún día me enseñes a hacer el budín.\n\nLo de las plantas ya lo doy por perdido.\n\nEl budín es de caja.\n\nLe pongo ralladura de mandarina para que parezca casero.\n\nNo le digas a tu hermano.","tipo":"Correspondencia ajena","titulo":"La planta"},{"id":"me-dio-verguenza","actualizado":"2026-11-20T20:15:54.010Z","creado":"2026-11-20T20:15:54.010Z","texto":"No te contesté antes porque quería pensar bien qué decirte y después pasó tanto tiempo que me dio vergüenza contestarte cualquier cosa.","tipo":"Me escribieron","titulo":"Me dio vergüenza"},{"id":"no-tocar-recien-pintado","actualizado":"2026-11-20T20:04:41.364Z","creado":"2026-11-20T20:04:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"No tocar. Recién pintado"},{"id":"oreykswb7zzh6eeccz5s","actualizado":"2026-11-20T18:16:09.526Z","creado":"2026-11-20T15:00:00.000Z","sinFecha":true,"texto":"Escuché a una chica decirle a su amiga que había borrado todas las fotos de su ex.\n\n—Y de la papelera?\n\n—No me rompas las pelotas.","tipo":"No era para tanto","titulo":"Papelera"},{"id":"para-a-que-siempre-me-devuelve-los-libros","actualizado":"2026-11-20T20:08:41.364Z","bajada":"La primera página de un libro que me regalaron.","creado":"2026-11-20T20:08:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"Para A., que siempre me devuelve los libros"},{"id":"por-motivos-personales","actualizado":"2026-11-20T20:02:41.364Z","creado":"2026-11-20T20:02:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"Por motivos personales"},{"id":"recordatorio","actualizado":"2026-11-17T12:00:00.000Z","bajada":"De qué te estás olvidando?","creado":"2026-11-16T14:00:00.000Z","escuchar":true,"formato":"postits","texto":"Los post-it existen porque la memoria es bastante mala.\n**O bastante optimista.**\n\nConfía en que mañana se va a acordar de lo que hoy le parece imposible olvidar.\nEntonces una escribe:\n\n\"Comprar detergente.\"\n\"Llamar al plomero.\"\n\"Reunión 16 hs.\"\n\"Responder ese mail.\"\n\nY lo pega donde sabe que inevitablemente va a volver a mirar.\n\nHay algo muy tierno en eso. Aceptar que una se olvida y,\nen lugar de enojarse, dejarse una ayuda.\nUn mensaje escrito por uno mismo para una versión futura que\nprobablemente esté más cansada, más apurada o pensando en otra cosa.\n\nLas fotografías hacen algo parecido.\nTambién intentan que algo no se pierda.\nNo una reunión o una lista de compras,\nsino un gesto, una luz, una conversación, una persona,\nuna forma de mirar el mundo.\n\n**Capaz por eso fotografiamos: porque también desconfiamos de la memoria.**\n\nLo curioso es que casi nunca usamos un post-it para las cosas importantes.\nNadie escribe:\n\n\"escuchá más\"\n\"andá más despacio\"\n\"no te acostumbres\"\n\"seguí\"\n\"no pierdas la capacidad de asombro\"\n\nComo si diéramos por hecho que de eso sí nos vamos a acordar.\nPero no.\n\nLa rutina tiene una habilidad impresionante para borrar lo que parecía inolvidable.\nNos acostumbramos demasiado rápido.\n\n**Al ruido.**\n**A las malas noticias.**\n**A que todo sea urgente.**\n**A creer que no hay tiempo.**\n**A pasar por al lado de alguien sin mirarlo.**\n\nIncluso a dejar de mirar las imágenes,\ncomo si una foto fuera apenas una foto\ny no una invitación a detenerse un momento más.\n\n---\n\n**Esta muestra insiste en aquello que merece volver a ser mirado.**\n\nQue construir lleva tiempo.\nQue cuidar también es hacer.\nQue ninguna transformación aparece de un día para el otro.\nQue hay personas que sostienen mucho más de lo que se ve.\nQue todavía vale la pena encontrarse.\n\nY que, si hace falta escribirlo en un papel\no guardarlo en una imagen para volver a verlo una y otra vez, está bien.\n\nPorque algunas cosas existen, justamente,\nporque alguien decidió no olvidarlas.\n\n**La esperanza es una de ellas.**","tipo":"Postdata.","titulo":"recordatorio"},{"id":"renuncia-voluntaria","actualizado":"2026-11-18T16:40:25.711Z","bajada":"Leí que no es necesario explicar los motivos de una renuncia, pero conozco a Susana y sé que va a preguntar.","creado":"2026-11-17T15:00:00.000Z","mails":[{"asunto":"Hola, renuncio","cuerpo":"Estimados:\n\nNo sé muy bien a quién estoy estimando porque me dieron una dirección de correo genérica, pero me dijeron que tenía que mandar acá mi renuncia.\n\nRenuncio.\n\nMe habían recomendado que fuera breve, pero estuve tres años y cuatro meses trabajando con ustedes y tengo algunas cosas pendientes que me gustaría decir.\n\nLeí que no es necesario explicar los motivos de una renuncia, pero conozco a Susana y sé que va a preguntar. Así que prefiero dejar mi versión por escrito antes de que el lunes a las once de la mañana resulte que me fui porque mi novio consiguió trabajo en otra provincia.\n\nNo tengo novio, Susana.\n\nYa que estamos, si este mail te llega, quisiera decirte que lo del martes no fue un problema de comunicación. Me dijiste una cosa el lunes y otra completamente distinta el martes. Tengo los dos mails. No los voy a adjuntar porque ya está, pero los tengo.\n\nY lo del aire acondicionado nunca fue un problema de temperatura. A mí me molestaba que lo apagaras sin preguntar. Que es distinto.\n\nSi lo lee José, espero que algún día se anime a decir en una reunión que no sabe cuánto tiempo lleva hacer algo. No pasa nada, José. Nosotros tampoco sabemos muchas cosas y vos nos preguntás constantemente.\n\nTampoco me molestaba trabajar con vos. Me molestaba enterarme en las reuniones con los clientes de las cosas que supuestamente estábamos haciendo juntos. Me hubiese gustado participar de la reunión anterior, esa en la que decidías lo que íbamos a hacer.\n\nCon Marcela está todo bien. Marce, tengo tu tupper. Me lo llevé el día que comimos empanadas y después me dio vergüenza devolvértelo porque habían pasado como seis meses. Te lo llevo el viernes.\n\nTambién quisiera saber qué le compramos a Gustavo para su cumpleaños. Puse cinco mil pesos y después nadie me supo decir. Gustavo tampoco.\n\nSi esto lo lee solamente alguien de Recursos Humanos, mil disculpas. Supongo que podrían reenviar las partes correspondientes. Menos lo del tupper, que prefiero manejarlo personalmente.\n\nMi mamá me dijo que averiguara lo del telegrama y mi papá ya me preguntó tres veces si me deben vacaciones. No sé cómo explicarle que todavía estoy escribiendo el mail.\n\nQuiero aclarar también que no todo estuvo mal. Hay gente acá adentro que me cae espectacular. De hecho, buena parte del tiempo que estuve trabajando con ustedes me quedé porque me gustaba venir a ver a mis compañeros. Tuve dos ofertas de trabajo que rechacé por eso. Ahora pienso que tendría que haberles preguntado a ellos qué opinaban antes de tomar semejante decisión.\n\nEn cuanto a mis tareas, voy a dejar todo explicado en un documento. Por favor, léanlo. Se los pido especialmente porque ya me veo el lunes recibiendo mensajes de José.\n\nAh, Susana. Una última cosa. No está bueno que cada vez que alguien se va digas que nunca estuvo realmente comprometido con la empresa. Te escuché decirlo de un montón de personas que laburaban como animales. Seguramente el lunes lo digas de mí.\n\nBueno, creo que eso es todo.\n\nMe da un poco de tristeza irme, cosa que me tiene bastante fastidiosa porque durante los últimos ocho meses lo único que hice fue hablar de las ganas que tenía de irme.\n\nMi último día es el viernes.\n\nAvísenme si tengo que firmar algo o si alcanza con esto.\n\nGracias.\n\nLaura.\n\nP. D.: Si organizan una despedida, me gustaría que fuera el jueves. El viernes tengo dentista. Y antes de que pregunte Susana: sí, puedo cambiar el turno. Pero no quiero.","de":"Laura","estado":"Sin enviar","fecha":"","para":"Recursos Humanos","pie":"Borrador guardado a las 23:48. Última modificación: 02:17."}],"sinFecha":true,"texto":"Estimados:\n\nNo sé muy bien a quién estoy estimando porque me dieron una dirección de correo genérica, pero me dijeron que tenía que mandar acá mi renuncia.\n\nRenuncio.\n\nMe habían recomendado que fuera breve, pero estuve tres años y cuatro meses trabajando con ustedes y tengo algunas cosas pendientes que me gustaría decir.\n\nLeí que no es necesario explicar los motivos de una renuncia, pero conozco a Susana y sé que va a preguntar. Así que prefiero dejar mi versión por escrito antes de que el lunes a las once de la mañana resulte que me fui porque mi novio consiguió trabajo en otra provincia.\n\nNo tengo novio, Susana.\n\nYa que estamos, si este mail te llega, quisiera decirte que lo del martes no fue un problema de comunicación. Me dijiste una cosa el lunes y otra completamente distinta el martes. Tengo los dos mails. No los voy a adjuntar porque ya está, pero los tengo.\n\nY lo del aire acondicionado nunca fue un problema de temperatura. A mí me molestaba que lo apagaras sin preguntar. Que es distinto.\n\nSi lo lee José, espero que algún día se anime a decir en una reunión que no sabe cuánto tiempo lleva hacer algo. No pasa nada, José. Nosotros tampoco sabemos muchas cosas y vos nos preguntás constantemente.\n\nTampoco me molestaba trabajar con vos. Me molestaba enterarme en las reuniones con los clientes de las cosas que supuestamente estábamos haciendo juntos. Me hubiese gustado participar de la reunión anterior, esa en la que decidías lo que íbamos a hacer.\n\nCon Marcela está todo bien. Marce, tengo tu tupper. Me lo llevé el día que comimos empanadas y después me dio vergüenza devolvértelo porque habían pasado como seis meses. Te lo llevo el viernes.\n\nTambién quisiera saber qué le compramos a Gustavo para su cumpleaños. Puse cinco mil pesos y después nadie me supo decir. Gustavo tampoco.\n\nSi esto lo lee solamente alguien de Recursos Humanos, mil disculpas. Supongo que podrían reenviar las partes correspondientes. Menos lo del tupper, que prefiero manejarlo personalmente.\n\nMi mamá me dijo que averiguara lo del telegrama y mi papá ya me preguntó tres veces si me deben vacaciones. No sé cómo explicarle que todavía estoy escribiendo el mail.\n\nQuiero aclarar también que no todo estuvo mal. Hay gente acá adentro que me cae espectacular. De hecho, buena parte del tiempo que estuve trabajando con ustedes me quedé porque me gustaba venir a ver a mis compañeros. Tuve dos ofertas de trabajo que rechacé por eso. Ahora pienso que tendría que haberles preguntado a ellos qué opinaban antes de tomar semejante decisión.\n\nEn cuanto a mis tareas, voy a dejar todo explicado en un documento. Por favor, léanlo. Se los pido especialmente porque ya me veo el lunes recibiendo mensajes de José.\n\nAh, Susana. Una última cosa. No está bueno que cada vez que alguien se va digas que nunca estuvo realmente comprometido con la empresa. Te escuché decirlo de un montón de personas que laburaban como animales. Seguramente el lunes lo digas de mí.\n\nBueno, creo que eso es todo.\n\nMe da un poco de tristeza irme, cosa que me tiene bastante fastidiosa porque durante los últimos ocho meses lo único que hice fue hablar de las ganas que tenía de irme.\n\nMi último día es el viernes.\n\nAvísenme si tengo que firmar algo o si alcanza con esto.\n\nGracias.\n\nLaura.\n\nP. D.: Si organizan una despedida, me gustaría que fuera el jueves. El viernes tengo dentista. Y antes de que pregunte Susana: sí, puedo cambiar el turno. Pero no quiero.","tipo":"Correspondencia ajena","titulo":"Renuncio"},{"id":"se-suspende-hasta-nuevo-aviso","actualizado":"2026-11-20T20:01:41.364Z","creado":"2026-11-20T20:01:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"Se suspende hasta nuevo aviso"},{"id":"si-queres-trae-hielo","actualizado":"2026-11-20T20:13:54.010Z","creado":"2026-11-20T20:13:54.010Z","texto":"Te escribo ahora porque después me olvido: el domingo no lleves nada. Ya compramos todo. Si querés traé hielo.","tipo":"Me escribieron","titulo":"Si querés traé hielo"},{"id":"tengo-tu-regalo-todavia","actualizado":"2026-11-18T01:28:05.695Z","bajada":"Me enteré por una historia de Instagram.","creado":"2026-11-18T01:28:05.695Z","texto":"No sé si alguna vez te voy a contar cuánto me dolió lo de tu cumpleaños. Hasta me da un poco de vergüenza estar escribiendo esto.\n\nMe enteré por una historia de Instagram de que habías festejado. No sé si te imaginás lo desconcertante que fue para mí verlo. Yo había pensado en tu cumpleaños, te había armado algunas cosas, te había comprado un regalo. En ningún momento se me había ocurrido que existía la posibilidad de que lo festejaras y yo no estuviera.\n\nSé que estás con ochenta cosas, que fue un año complicado y que seguramente tenías tus motivos para pasar ese día como lo pasaste. Y si no querías invitarme, está bien. No me interesa discutir eso.\n\nLo que nunca terminé de entender es por qué después no hablamos de lo que pasó. Porque vos sabías que yo me había enterado.\n\nY no sé, somos amigas. Mejores amigas. Me da hasta un poco de vergüenza escribirlo ahora, como si estuviera haciendo uso de un título que nadie me dio.\n\nNos veíamos bastante, tampoco es que éramos dos personas que habían perdido el contacto hacía años. Aunque, pensándolo un poco, casi siempre nos veíamos porque yo proponía algo. Nunca me había detenido demasiado en eso porque tenía ganas de verte y listo. No estaba llevando la cuenta de quién invitaba a quién.\n\nAhora, inevitablemente, pienso un poco en esas cosas.\n\nDesde tu cumpleaños no volvimos a hablar. Yo tampoco te escribí, ya sé. Pero por una vez tenía ganas de que me buscaras vos. Sobre todo porque pensé que te ibas a dar cuenta de que algo me había pasado con todo esto.\n\nNo sé si quiero que me pidas perdón. Ni siquiera sé de qué serviría que lo hicieras. Me gustaría entender qué pasó, qué pensaste vos después, si hubo algún momento en el que tuviste ganas de hablarme y decidiste no hacerlo.\n\nA lo mejor estoy haciendo una lectura completamente equivocada de nuestra amistad. Y qué vergüenza, también, si es así.\n\nPorque yo nunca tuve demasiadas dudas respecto de lo que significabas para mí.\n\nEn fin. Tengo tu regalo todavía.","tipo":"Cosas que no mandé","titulo":"Tengo tu regalo todavía"},{"id":"todo-limpio","actualizado":"2026-11-20T20:07:41.364Z","creado":"2026-11-20T20:07:41.364Z","texto":"","tipo":"Leí en algún lado","titulo":"Todo limpio. Hay algunas cosas nuevas"},{"id":"todo-lo-que-no-paso","actualizado":"2026-11-16T22:27:59.392Z","bajada":"Un mes entero hablando de alguien a quien nadie le habló.","chat":{"grupo":"Dios nos libre💋","mensajes":[{"dia":"Sábado 3 de octubre de 2026"},{"hora":"19:43","nombre":"Juli","quien":"yo","texto":"chicas"},{"hora":"19:43","nombre":"Juli","quien":"yo","texto":"me preguntó si iba hoy"},{"hora":"19:44","nombre":"Mora","quien":"otro","texto":"QUIÉN"},{"hora":"19:44","nombre":"Juli","quien":"yo","texto":"quién va a ser"},{"hora":"19:44", }
// Corta la frase en renglones que tengan sentido: corta después de comas y puntos,

const PALABRAS_DEBILES = new Set(("a al ante con contra de del desde durante el en entre es hacia hasta la las le les lo los " +
  "me mi mis muy ni no o para pero por porque que se si sin sobre su sus tan te tu tus un una unas unos y ya como cuando " +
  "aunque más cada donde mientras nos").split(" "));

    if (conSig > ancho) {
      // No entra: los conectores del final pasan al renglón siguiente junto con lo que sigue.
      const pasan = [];
      while (l.length > 1 && PALABRAS_DEBILES.has(limpia(l[l.length - 1]))) pasan.unshift(l.pop());
      lineas.push(l.join(" ")); l = pasan; continue;
    }
    if (/[,.;:!?…»”)]$/.test(p)) { lineas.push(l.join(" ")); l = []; continue; }
    if (PALABRAS_DEBILES.has(limpia(p))) continue;
    // Si la que sigue es un conector, mejor que empiece el renglón siguiente.
    if (PALABRAS_DEBILES.has(limpia(sig))) { lineas.push(l.join(" ")); l = []; continue; }
    if (l.length >= 2 || conSig > ancho * 0.72) { lineas.push(l.join(" ")); l = []; }
  }
  if (l.length) lineas.push(l.join(" "));
  return lineas;
}

// Pista (cada vez que se abre una nota): cuando empieza a leer, una frase se marca con resaltador
// y aparece un cartelito que explica que puede seleccionar frases para compartirlas.
const TEXTO_NOTA = ".prose, .lib-txt, .mail-body, .rec-p, .burb-t";
let pistaTimer = null;
function pistaFrase() {
  // Aparece cada vez que se abre una nota, como recordatorio: mientras la persona lee,
  // cada poquito se fija si hay una frase a la vista y la marca (después de unos segundos de lectura).
  clearInterval(pistaTimer);
  const art = document.querySelector(".article");
  if (!art || !art.querySelector(TEXTO_NOTA)) return;
  let visible = 0, total = 0, cont = null;
  pistaTimer = setInterval(() => {
    total += 600;
    if (!art.isConnected || total > 120000) { clearInterval(pistaTimer); return; }
    // En el librito hay páginas escondidas: sirve cualquier pedazo de texto que se esté viendo.
    cont = [...art.querySelectorAll(TEXTO_NOTA)].find(c => {
      const b = c.getBoundingClientRect();
      return b.width > 0 && b.top < window.innerHeight * 0.7 && b.bottom > window.innerHeight * 0.2;
    }) || null;
    visible = cont ? visible + 600 : 0;
    if (visible >= 1800 && mostrarPista(cont)) clearInterval(pistaTimer);

}

    // En los chats, cada mensaje cuenta como una frase aunque no termine en punto.

    style: `left:${rc.left + scrollX - 2}px;top:${rc.top + scrollY}px;width:${rc.width + 4}px;height:${rc.height}px;animation-delay:${0.15 + i * 0.4}s` })));

  const tip = el("button", { type: "button", className: "pista-tip",
    style: `left:${Math.max(scrollX + 12, Math.min(ult.left + scrollX, scrollX + window.innerWidth - 352))}px;top:${ult.bottom + scrollY + 12}px;animation-delay:${espera}s` },
    mini,

      el("span", { textContent: "en historias, WhatsApp o X. Tocá para probar." })));

  box.append(hoja, nav, dots, el("div", { className: "lib-pie2" }, modo), seguido);

// --- Formato "con post-its": las líneas entre comillas son post-its; **así** es negrita; una línea "---" abre un cierre centrado ---
const hashTxt = (s) => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
function renderPostits(d) {
  const cont = el("div", { className: "recuerdo" }, el("h2", { className: "rec-tit", textContent: d.titulo || "" }));
  let bloque = cont, parrafo = [], notas = [];
  const fmt = (s) => { const sp = el("span"); s.split(/(\*\*[^*]+\*\*)/).forEach(t => { if (/^\*\*[^*]+\*\*$/.test(t)) sp.append(el("b", { textContent: t.slice(2, -2) })); else if (t) sp.append(t); }); return sp; };
  const cerrarP = () => { if (!parrafo.length) return; const p = el("p", { className: "rec-p" }); parrafo.forEach((l, i) => { if (i) p.append(el("br")); p.append(fmt(l)); }); bloque.append(p); parrafo = []; };
  const cerrarN = () => {
    if (!notas.length) return;
    bloque.append(el("div", { className: "postits" }, ...notas.map(n => {
      const h = hashTxt(n);
      return el("div", { className: "postit c" + (h % 4), style: `--r:${((h % 9) - 4) * 0.9}deg;--dy:${(h >> 3) % 26}px` }, el("span", { textContent: n }));
    })));
    notas = [];
  };
  for (const l0 of (d.texto || "").replace(/\r/g, "").split("\n")) {
    const l = l0.trim();
    if (l === "---") { cerrarP(); cerrarN(); bloque = el("div", { className: "rec-centro" }); cont.append(bloque); continue; }
    if (!l) { cerrarP(); cerrarN(); continue; }
    const q = l.match(/^["“«](.+)["”»]$/);
    if (q) { cerrarP(); notas.push(q[1]); continue; }
    cerrarN(); parrafo.push(l);
  }
  cerrarP(); cerrarN();
  return cont;
}

// --- Escuchar la nota con la voz del dispositivo (gratis, sin grabar). Por ahora solo en las notas con escuchar: true ---
const ESCUCHAR_TODAS = false;
function textoParaLeer(d) {
  let cuerpo;
  if (isThread(d)) { const subs = asuntos(d.titulo, d.mails); cuerpo = d.mails.map((m, i) => `Mail de ${m.de || "alguien"} para ${m.para || "alguien"}. Asunto: ${subs[i]}.\n${m.cuerpo || ""}`).join("\n\n"); }
  else if (isChat(d)) { cuerpo = d.chat.mensajes.map(m => m.dia ? m.dia + "." : `${nombreDe(d.chat, m) || "Alguien"}: ${m.texto || ""}`).join("\n"); }
  else cuerpo = String(d.texto || "").replace(/\*\*/g, "").replace(/^\s*["“«](.+)["”»]\s*$/gm, (m, s) => /[.!?…]$/.test(s) ? s : s + ".").replace(/^---$/gm, "");
  return (d.titulo || "") + ".\n\n" + cuerpo;
}
function trozosLectura(t) {
  const out = [];
  t.split(/\n+/).forEach(linea => { (linea.match(/[^.!?…]+[.!?…]*/g) || []).forEach(s => { s = s.trim(); if (s) out.push(s); }); });
  return out;
}
// Puntúa las voces en español: primero las "naturales" (neuronales, mejoradas, premium), después el acento más cercano.
function puntajeVoz(v) {
  const n = v.name || "", l = (v.lang || "").replace("_", "-").toLowerCase();
  let p = 0;
  if (/natural|neural|online|premium|enhanced|mejorad|siri/i.test(n)) p += 100;
  if (/google/i.test(n)) p += 40;
  if (l === "es-ar") p += 30; else if (["es-419", "es-us", "es-mx", "es-uy", "es-cl", "es-co"].includes(l)) p += 20; else if (l === "es-es") p += 5;
  if (/compact|eloquence|grandma|grandpa|bad news|bells|bubbles|jester|whisper|zarvox|trinoids|organ|boing|cellos|albert|fred|junior|ralph|kathy|superstar/i.test(n)) p -= 200;
  return p;
}
function vocesEspanol() {
  return speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)).sort((a, b) => puntajeVoz(b) - puntajeVoz(a));
}
function vozEspanol() {
  const voces = vocesEspanol();
  let elegida = null; try { elegida = localStorage.getItem("voz-lectura"); } catch {}
  return voces.find(v => v.name === elegida) || voces[0] || null;
}
const nombreVoz = (v) => v.name.replace(/^(Microsoft|Google)\s+/i, "").replace(/\s*-\s*Spanish.*$/i, "").replace(/\s*\(.*?\)\s*$/, "") + " · " + v.lang.replace("_", "-");
function escucharBlock(d) {
  if (!("speechSynthesis" in window) || !(ESCUCHAR_TODAS || d.escuchar)) return null;
  try { speechSynthesis.getVoices(); } catch {}
  const partes = trozosLectura(textoParaLeer(d));
  let i = 0, estado = "parado", vel = 1, gen = 0;
  const btn = el("button", { type: "button", className: "share esc-btn", textContent: "🔊 Escuchar esta nota" });
  const stop = el("button", { type: "button", className: "esc-stop", textContent: "Detener", hidden: true });
  const velSel = el("select", { className: "esc-vel", title: "Velocidad" },
    ...[["0.85", "Más lento"], ["1", "Normal"], ["1.2", "Más rápido"]].map(([v, t]) => el("option", { value: v, textContent: t, selected: v === "1" })));
  const info = el("span", { className: "esc-info", textContent: "Con la voz de tu celu o compu" });
  const vozSel = el("select", { className: "esc-vel esc-voz", title: "Voz" });
  const llenarVoces = () => {
    const voces = vocesEspanol(), actual = vozEspanol();
    vozSel.replaceChildren(...voces.map(v => el("option", { value: v.name, textContent: nombreVoz(v), selected: actual && v.name === actual.name })));
    vozSel.hidden = voces.length < 2;
  };
  llenarVoces();
  try { speechSynthesis.addEventListener("voiceschanged", llenarVoces); } catch {}
  vozSel.onchange = () => { try { localStorage.setItem("voz-lectura", vozSel.value); } catch {} if (estado === "hablando") { speechSynthesis.cancel(); decir(); } };
  const fin = () => { gen++; estado = "parado"; i = 0; btn.textContent = "🔊 Escuchar esta nota"; stop.hidden = true; };
  const decir = () => {
    if (i >= partes.length) { fin(); return; }
    const g = ++gen;
    const u = new SpeechSynthesisUtterance(partes[i]);
    const v = vozEspanol(); if (v) u.voice = v; u.lang = v ? v.lang : "es-AR"; u.rate = vel;
    u.onend = () => { if (estado === "hablando" && g === gen) { i++; decir(); } };
    speechSynthesis.speak(u);
  };
  btn.onclick = () => {
    if (estado === "parado") { speechSynthesis.cancel(); estado = "hablando"; btn.textContent = "⏸ Pausar"; stop.hidden = false; decir(); }
    else if (estado === "hablando") { estado = "pausa"; gen++; speechSynthesis.cancel(); btn.textContent = "▶ Seguir"; }
    else { estado = "hablando"; btn.textContent = "⏸ Pausar"; decir(); }
  };
  stop.onclick = () => { speechSynthesis.cancel(); fin(); };
  velSel.onchange = () => { vel = parseFloat(velSel.value); if (estado === "hablando") { speechSynthesis.cancel(); decir(); } };
  return el("div", { className: "escuchar" }, btn, stop, velSel, vozSel, info);
}
const callarLectura = () => { try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch {} };
