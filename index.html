<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una tal_</title>
<meta name="description" content="Poemas, cuentos y ensayos de Una tal.">
<meta property="og:title" content="Una tal_">
<meta property="og:description" content="Poemas, cuentos y ensayos de Una tal.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tengomisrazones.ar/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0c'/%3E%3Crect x='8' y='22' width='16' height='3' fill='%23f8f8f6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root {
  --paper: #f8f8f6; --ink: #0b0b0c; --ink-soft: #5d5d62; --rule: #0b0b0c; --hair: #d4d4d1;
  --band: #0b0b0c; --band-ink: #f8f8f6;
  --f-head: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0f0f10; --ink: #f1f1ee; --ink-soft: #9c9ca2; --rule: #f1f1ee; --hair: #34343a; --band: #f1f1ee; --band-ink: #0f0f10; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-head); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 72px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 22px 18px; border-bottom: 1px solid var(--rule); }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; font-size: 15px; }
.nav .dash { width: 18px; height: 1px; background: var(--ink); }
.nav a { color: var(--ink); text-decoration: none; }
.nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
.mast { font-weight: 900; text-transform: uppercase; letter-spacing: -0.045em; line-height: 0.82; font-size: clamp(64px, 17vw, 230px); margin: 0; padding-block: 34px 18px; overflow-wrap: anywhere; }
.cursor { display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .cursor { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } } }
.ticker { display: flex; align-items: center; background: var(--band); color: var(--band-ink); overflow: hidden; height: 52px; }
.ticker .lab { flex: none; font-weight: 800; font-size: 14px; text-transform: uppercase; padding-inline: 18px 22px; white-space: nowrap; background: var(--band); position: relative; z-index: 1; }
.ticker .track { display: flex; }
.ticker .run { display: flex; gap: 48px; white-space: nowrap; font-size: 14px; padding-right: 48px; }
.ticker a { color: inherit; text-decoration: none; }
.ticker a:hover { text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { .ticker .track { animation: slide 40s linear infinite; } @keyframes slide { to { transform: translateX(-50%); } } }
.lead { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px 48px; padding-block: 48px 56px; border-bottom: 1px solid var(--rule); }
.lead h2 { font-weight: 900; text-transform: uppercase; letter-spacing: -0.035em; line-height: 0.92; font-size: clamp(40px, 6.6vw, 88px); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.lead h2 a { color: inherit; text-decoration: none; }
.lead h2 a:hover { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; }
.lead .ex { font-family: var(--f-read); font-size: 18px; line-height: 1.6; margin: 0 0 22px; max-width: 46ch; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; font-size: 13px; }
.meta b { font-weight: 600; margin-right: 6px; }
.pill { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 3px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; padding-top: 40px; }
.sect { font-weight: 800; text-transform: uppercase; font-size: 13px; margin: 0 0 6px; }
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px 28px; padding-block: 28px; border-top: 1px solid var(--hair); }
.row:first-child { border-top: 1px solid var(--rule); }
.row .num { font-weight: 900; font-size: 42px; letter-spacing: -0.04em; line-height: 0.9; font-variant-numeric: tabular-nums; }
.row h3 { font-weight: 800; font-size: clamp(22px, 2.6vw, 32px); letter-spacing: -0.02em; line-height: 1.08; margin: 0 0 10px; text-wrap: balance; }
.row h3 a { color: inherit; text-decoration: none; }
.row h3 a:hover { text-decoration: underline; text-underline-offset: 5px; }
.row p { font-family: var(--f-read); font-size: 16.5px; line-height: 1.55; margin: 0 0 14px; max-width: 62ch; }
.note { color: var(--ink-soft); padding-block: 20px; border-top: 1px solid var(--rule); font-size: 15px; }
aside.side { display: flex; flex-direction: column; gap: 28px; }
.big { font-weight: 900; font-size: 64px; letter-spacing: -0.045em; line-height: 0.9; font-variant-numeric: tabular-nums; }
.side .blk { border-top: 1px solid var(--rule); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.search { width: 100%; font: inherit; padding: 10px 0; border: 0; border-bottom: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 12px; text-transform: uppercase; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.article { padding-top: 36px; }
.article .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; padding-bottom: 28px; }
.article .top a { color: var(--ink); text-decoration: none; }
.article .top a:hover { text-decoration: underline; text-underline-offset: 4px; }
.article h2 { font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: 0.9; font-size: clamp(42px, 8.5vw, 120px); margin: 0 0 32px; text-wrap: balance; overflow-wrap: anywhere; }
.article .metarow { border-block: 1px solid var(--rule); padding-block: 14px; margin-bottom: 44px; }
.prose { font-family: var(--f-read); font-size: 20px; line-height: 1.72; max-width: 64ch; margin: 0 auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.firma { max-width: 64ch; margin: 56px auto 0; padding-top: 18px; border-top: 1px solid var(--rule); font-weight: 800; text-transform: uppercase; font-size: 14px; }
footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-soft); }
a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
@media (max-width: 860px) {
  .lead { grid-template-columns: minmax(0, 1fr); padding-block: 32px 40px; }
  .cols { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  aside.side { order: -1; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .row .num { font-size: 28px; }
  .big { font-size: 48px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="#">Una tal_</a>
    <nav class="nav" aria-label="Secciones">
      <a href="#">Todas las notas</a>
      <span class="dash" aria-hidden="true"></span>
      <span id="stats" style="font-variant-numeric:tabular-nums"></span>
    </nav>
  </header>
  <main id="view"></main>
  <footer><span>Una tal_ · tengomisrazones.ar</span><span id="anio"></span></footer>
</div>

<!-- Las notas. Para actualizar el sitio, se reemplaza solo este bloque. -->
<script type="application/json" id="notas">[]</script>

<script>
const NOTAS = (() => { try { return JSON.parse(document.getElementById("notas").textContent); } catch { return []; } })()
  .sort((a, b) => String(b.creado).localeCompare(String(a.creado)));
const TIPOS = ["Poema", "Cuento", "Ensayo", "Diario", "Carta", "Otro"];
const state = { filtro: "Todos", q: "" };
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "style" || k.startsWith("aria-")) n.setAttribute(k, v); else n[k] = v; } for (const k of kids) if (k != null && k !== false) n.append(k); return n; };
const words = (s) => (s || "").trim().split(/\s+/).filter(Boolean).length;
const mins = (s) => Math.max(1, Math.round(words(s) / 200));
const fmtFecha = (iso) => { try { return new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" }); } catch { return ""; } };
const excerpt = (s, n = 230) => { const t = (s || "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n).replace(/\s\S*$/, "") + "…" : t; };
const pad = (n) => String(n).padStart(2, "0");
const href = (d) => "#" + encodeURIComponent(d.id);

function meta(d) {
  return el("div", { className: "meta" },
    el("span", {}, el("b", { textContent: "Tipo" }), d.tipo || "Otro"),
    el("span", {}, el("b", { textContent: "Fecha" }), fmtFecha(d.creado)),
    el("span", {}, el("b", { textContent: "Lectura" }), mins(d.texto) + " min"),
    el("span", { className: "pill", textContent: d.tipo || "Otro" }));
}

function ticker() {
  const items = NOTAS.slice(0, 8);
  const run = () => el("div", { className: "run" }, ...(items.length ? items.map(d => el("a", { href: href(d), textContent: d.titulo || "Sin título" })) : [el("span", { textContent: "Muy pronto, las primeras notas" })]));
  return el("div", { className: "ticker", "aria-label": "Últimas notas" }, el("span", { className: "lab", textContent: "Últimas notas+++" }), el("div", { className: "track" }, run(), run()));
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return NOTAS.filter(d => (state.filtro === "Todos" || d.tipo === state.filtro) && (!q || (d.titulo || "").toLowerCase().includes(q) || (d.texto || "").toLowerCase().includes(q)));
}

function renderList() {
  const list = $("list"); const items = filtered();
  list.replaceChildren(...items.map(d => el("article", { className: "row" },
    el("div", { className: "num", textContent: pad(NOTAS.length - NOTAS.indexOf(d)) }),
    el("div", { style: "min-width:0" }, el("h3", {}, el("a", { href: href(d), textContent: d.titulo || "Sin título" })), el("p", { textContent: excerpt(d.texto) }), meta(d)))));
  if (!NOTAS.length) list.append(el("div", { className: "note", textContent: "Todavía no hay notas publicadas." }));
  else if (!items.length) list.append(el("div", { className: "note", textContent: "Ninguna nota coincide con esa búsqueda." }));
}

function renderHome(v) {
  document.title = "Una tal_";
  const kids = [el("h1", { className: "mast" }, "Una tal", el("span", { className: "cursor", textContent: "_" })), ticker()];
  const lead = NOTAS[0];
  kids.push(lead
    ? el("section", { className: "lead" }, el("h2", {}, el("a", { href: href(lead), textContent: lead.titulo || "Sin título" })), el("div", {}, el("p", { className: "ex", textContent: excerpt(lead.texto, 320) }), meta(lead)))
    : el("section", { className: "lead" }, el("h2", { textContent: "Tengo mis razones" }), el("div", {}, el("p", { className: "ex", textContent: "Poemas, cuentos y ensayos. Las primeras notas llegan pronto." }))));
  const search = el("input", { className: "search", type: "search", placeholder: "Buscar en las notas", value: state.q, "aria-label": "Buscar en las notas" });
  search.oninput = (e) => { state.q = e.target.value; renderList(); };
  const tipos = ["Todos", ...TIPOS.filter(t => NOTAS.some(d => d.tipo === t))];
  const chips = el("div", { className: "chips" }, ...tipos.map(t => {
    const b = el("button", { type: "button", className: "chip", textContent: t, "aria-pressed": String(state.filtro === t) });
    b.onclick = () => { state.filtro = t; chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.textContent === t))); renderList(); };
    return b;
  }));
  const side = el("aside", { className: "side" },
    el("div", { className: "blk" }, el("p", { className: "sect", textContent: "Notas" }), el("div", { className: "big", textContent: `${pad(NOTAS.length)} / ${new Date().getFullYear()}` })),
    NOTAS.length ? el("div", { className: "blk" }, el("p", { className: "sect", textContent: "Buscar" }), search) : null,
    NOTAS.length > 1 ? el("div", { className: "blk" }, el("p", { className: "sect", textContent: "Por tipo" }), chips) : null);
  kids.push(el("div", { className: "cols" }, el("section", {}, el("p", { className: "sect", textContent: "Todas las notas" }), el("div", { className: "list", id: "list" })), side));
  v.replaceChildren(...kids); renderList();
}

function renderRead(v, d) {
  document.title = (d.titulo || "Sin título") + " — Una tal_";
  const metaRow = meta(d); metaRow.classList.add("metarow");
  v.replaceChildren(el("article", { className: "article" },
    el("div", { className: "top" }, el("a", { href: "#", textContent: "← Todas las notas" }), el("span", { className: "pill", textContent: d.tipo || "Otro" })),
    el("h2", { textContent: d.titulo || "Sin título" }), metaRow,
    el("div", { className: "prose", textContent: d.texto || "" }),
    el("div", { className: "firma", textContent: "Una tal_" })));
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const d = id && NOTAS.find(n => n.id === id);
  d ? renderRead($("view"), d) : renderHome($("view"));
  window.scrollTo({ top: 0 });
}

const total = NOTAS.reduce((a, d) => a + words(d.texto), 0);
$("stats").textContent = NOTAS.length ? `${NOTAS.length} ${NOTAS.length === 1 ? "nota" : "notas"} · ${total.toLocaleString("es-AR")} palabras` : "";
$("anio").textContent = "© " + new Date().getFullYear();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
