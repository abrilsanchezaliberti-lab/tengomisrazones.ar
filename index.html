<style>

<script type="application/json" id="notas">[{"id":"8sfi9plwson6irgsrhs2","actualizado":"2026-11-16T18:39:13.672Z","bajada":"JULIÁN LLAMAME","creado":"2026-11-16T18:35:49.108Z","mails":[{"cuerpo":"Necesito que me llames y finjas que pasó algo grave.\n\nEstoy en una cita y el tipo acaba de decir que no cree en los dinosaurios.\n\nNo sé cómo llegamos a este tema.\n\nPor favor llamame.","de":"Clara","fecha":"","para":"Julian"},{"cuerpo":"Pero cree que no existieron o que siguen vivoss?","de":"Julian","fecha":"","para":"Clara"},{"cuerpo":"JULIÁN LLAMAME.","de":"Clara","fecha":"","para":"Julian"},{"cuerpo":"Es importante saberlo.","de":"Julian","fecha":"","para":"Clara"},{"cuerpo":"Dice que los huesos los pusieron los museos.","de":"Clara","fecha":"","para":"Julian"},{"cuerpo":"Quedate un rato más. Quiero saber qué opina de las jirafas.","de":"Julian","fecha":"","para":"Clara"}],"texto":"Necesito que me llames y finjas que pasó algo grave.\n\nEstoy en una cita y el tipo acaba de decir que no cree en los dinosaurios.\n\nNo sé cómo llegamos a este tema.\n\nPor favor llamame.\n\nPero cree que no existieron o que siguen vivoss?\n\nJULIÁN LLAMAME.\n\nEs importante saberlo.\n\nDice que los huesos los pusieron los museos.\n\nQuedate un rato más. Quiero saber qué opina de las jirafas.","tipo":"Correspondencia ajena","titulo":"Urgente"},{"id":"8t2pkbohz35oshrft675","actualizado":"2026-11-16T20:05:10.116Z","bajada":"Las cosas que hacemos juntos","creado":"2026-11-16T20:05:10.116Z","destacada":true,"mails":[{"cuerpo":"No sé por qué te estoy escribiendo si vivimos en la misma casa.\n\nSupongo que porque ayer, cuando intenté explicarte lo que me pasaba, terminamos discutiendo sobre algo que no tenía nada que ver. Vos decías que yo nunca estaba conforme con nada y yo te dije que últimamente me daba la impresión de que hacíamos todo por inercia.\n\nNo quise decir que no te quiero.\n\nPero me preocupa que cada vez que digo que algo de nuestra relación no me gusta, vos entiendas que estoy cuestionando toda nuestra relación.\n\nEl domingo me preguntaste qué quería hacer y te dije que nada. Me dijiste que bueno, que nos quedáramos en casa. Y me enojé.\n\nYa sé. Es bastante difícil convivir conmigo cuando ni siquiera yo sé qué quiero.\n\nPero me parece que hace tiempo dejamos de preguntarnos cosas de verdad. Nos preguntamos qué vamos a comer, si pagamos la luz, si hay ropa para lavar. No sé cuándo fue la última vez que me preguntaste algo que no supieras de mí.\n\nY yo tampoco te pregunto.\n\nNo quiero que me contestes que tenemos que salir más o hacer algún viaje. No estoy hablando de eso.\n\nCreo que me da miedo que nos conozcamos tanto que un día ya no tengamos curiosidad.","de":"Cata","fecha":"","para":"Fran"},{"cuerpo":"\nMe parece injusto que digas que no te pregunto cosas.\n\nEl domingo te pregunté qué querías hacer. Me dijiste que nada. Después te enojaste porque no hice nada.\n\nNo sé qué esperás de mí cuando hacés eso.\n\nY no es que no entienda lo que decís. A mí también me pasa que a veces siento que vivimos repitiendo los mismos días. Pero no creo que eso sea necesariamente malo.\n\nHay algo que me gusta de saber que los jueves llegás tarde y que si te guardo comida te vas a poner contenta. Me gusta no tener que preguntarte todo el tiempo cómo estás para darme cuenta de que tuviste un día de mierda.\n\nA veces pienso que vos confundís la tranquilidad con el aburrimiento.\n\nY que cada tanto necesitás encontrar un problema para comprobar que todavía nos importa resolverlo.\n\nNo sé si es justo que te diga eso, pero es lo que pienso.","de":"Fran","fecha":"","para":"Cata"},{"cuerpo":"Lo leí tres veces.\n\nLa primera me enojé. La segunda también.\n\nLa tercera pensé que quizás tenías razón en algunas cosas.\n\nMe quedé pensando en eso que dijiste de que te gusta saber cómo estoy sin preguntarme. A mí también me gusta que me conozcas. Muchísimo.\n\nPero hay algo que me hace ruido.\n\nPorque a veces no estoy como vos creés que estoy. Y cuando intento explicártelo, siento que tengo que discutir contra una versión de mí que vos ya tenés bastante resuelta.\n\nEl otro día me dijiste que yo siempre necesito tener planes. Lo dijiste como si fuera una característica mía que ya no pudiera cambiar. Como si estuviera condenada a ser la misma persona que era cuando nos conocimos.\n\nY capaz que no quiero hacer nada.\n\nCapaz que quiero aburrirme.\n\nO capaz que quiero aburrirme con vos, pero de otra manera.\n\nNo sé si se entiende.","de":"Cata","fecha":"","para":"Fran"},{"cuerpo":"Se entiende.\n\nAunque hay algo que no te dije.\n\nA veces siento que si no estamos haciendo algo interesante, vos pensás que estamos desperdiciando el tiempo.\n\nY a mí me gusta perder el tiempo con vos.\n\nNo sé cómo explicarlo sin que suene a una de esas frases horribles que ponen en las tazas.\n\nPero me gusta.\n\nAyer, mientras vos estabas escribiendo esto, yo estaba en la cocina esperando que terminara de hervir el agua. Me preguntaste si quería mate. Te dije que sí. Después me contaste una cosa de tu trabajo y te reíste sola antes de terminar de contarla.\n\nNo sé si eso alcanza para lo que vos querés de una pareja.\n\nPara mí, ayer alcanzó.\n\nIgual tenemos que hablar de lo otro. Y comprar yerba.","de":"Fran","fecha":"","para":"Cata"}],"texto":"No sé por qué te estoy escribiendo si vivimos en la misma casa.\n\nSupongo que porque ayer, cuando intenté explicarte lo que me pasaba, terminamos discutiendo sobre algo que no tenía nada que ver. Vos decías que yo nunca estaba conforme con nada y yo te dije que últimamente me daba la impresión de que hacíamos todo por inercia.\n\nNo quise decir que no te quiero.\n\nPero me preocupa que cada vez que digo que algo de nuestra relación no me gusta, vos entiendas que estoy cuestionando toda nuestra relación.\n\nEl domingo me preguntaste qué quería hacer y te dije que nada. Me dijiste que bueno, que nos quedáramos en casa. Y me enojé.\n\nYa sé. Es bastante difícil convivir conmigo cuando ni siquiera yo sé qué quiero.\n\nPero me parece que hace tiempo dejamos de preguntarnos cosas de verdad. Nos preguntamos qué vamos a comer, si pagamos la luz, si hay ropa para lavar. No sé cuándo fue la última vez que me preguntaste algo que no supieras de mí.\n\nY yo tampoco te pregunto.\n\nNo quiero que me contestes que tenemos que salir más o hacer algún viaje. No estoy hablando de eso.\n\nCreo que me da miedo que nos conozcamos tanto que un día ya no tengamos curiosidad.\n\n\nMe parece injusto que digas que no te pregunto cosas.\n\nEl domingo te pregunté qué querías hacer. Me dijiste que nada. Después te enojaste porque no hice nada.\n\nNo sé qué esperás de mí cuando hacés eso.\n\nY no es que no entienda lo que decís. A mí también me pasa que a veces siento que vivimos repitiendo los mismos días. Pero no creo que eso sea necesariamente malo.\n\nHay algo que me gusta de saber que los jueves llegás tarde y que si te guardo comida te vas a poner contenta. Me gusta no tener que preguntarte todo el tiempo cómo estás para darme cuenta de que tuviste un día de mierda.\n\nA veces pienso que vos confundís la tranquilidad con el aburrimiento.\n\nY que cada tanto necesitás encontrar un problema para comprobar que todavía nos importa resolverlo.\n\nNo sé si es justo que te diga eso, pero es lo que pienso.\n\nLo leí tres veces.\n\nLa primera me enojé. La segunda también.\n\nLa tercera pensé que quizás tenías razón en algunas cosas.\n\nMe quedé pensando en eso que dijiste de que te gusta saber cómo estoy sin preguntarme. A mí también me gusta que me conozcas. Muchísimo.\n\nPero hay algo que me hace ruido.\n\nPorque a veces no estoy como vos creés que estoy. Y cuando intento explicártelo, siento que tengo que discutir contra una versión de mí que vos ya tenés bastante resuelta.\n\nEl otro día me dijiste que yo siempre necesito tener planes. Lo dijiste como si fuera una característica mía que ya no pudiera cambiar. Como si estuviera condenada a ser la misma persona que era cuando nos conocimos.\n\nY capaz que no quiero hacer nada.\n\nCapaz que quiero aburrirme.\n\nO capaz que quiero aburrirme con vos, pero de otra manera.\n\nNo sé si se entiende.\n\nSe entiende.\n\nAunque hay algo que no te dije.\n\nA veces siento que si no estamos haciendo algo interesante, vos pensás que estamos desperdiciando el tiempo.\n\nY a mí me gusta perder el tiempo con vos.\n\nNo sé cómo explicarlo sin que suene a una de esas frases horribles que ponen en las tazas.\n\nPero me gusta.\n\nAyer, mientras vos estabas escribiendo esto, yo estaba en la cocina esperando que terminara de hervir el agua. Me preguntaste si quería mate. Te dije que sí. Después me contaste una cosa de tu trabajo y te reíste sola antes de terminar de contarla.\n\nNo sé si eso alcanza para lo que vos querés de una pareja.\n\nPara mí, ayer alcanzó.\n\nIgual tenemos que hablar de lo otro. Y comprar yerba.","tipo":"Correspondencia ajena","titulo":"lo del domingo"},{"id":"jffvshykl3y6t11fvgjx","actualizado":"2026-11-16T19:59:50.732Z","creado":"2026-11-16T19:59:50.732Z","mails":[{"cuerpo":"Se me murió la planta que me diste.\n\nNo sé cómo pasó.\n\nLa regué como me dijiste, la puse cerca de la ventana y hasta le hablé un par de veces porque una compañera del trabajo dice que sirve.\n\nSe murió igual.\n\nMe acordé de que cuando era chica vos tenías plantas por todos lados. En la cocina, en el patio, arriba de la heladera. Algunas las habías sacado de gajos que encontrabas caminando.\n\nYo nunca pude mantener viva ninguna.\n\nTampoco aprendí a coser ni a hacer ese budín de mandarina que preparabas los domingos.\n\nA veces me da un poco de tristeza pensar en todas las cosas que sabés hacer y que yo no aprendí.\n\nEl otro día quise arreglar un botón y terminé llevándolo a una modista.\n\nMe cobró una fortuna. Que hija de puta\n\nMe gustaría que algún día me enseñes a hacer el budín.\n\nLo de las plantas ya lo doy por perdido.","de":"Marina","fecha":"","para":"Mamá"},{"cuerpo":"El budín es de caja.\n\nLe pongo ralladura de mandarina para que parezca casero.\n\nNo le digas a tu hermano.","de":"Mamá","fecha":"","para":"Marina"}],"texto":"Se me murió la planta que me diste.\n\nNo sé cómo pasó.\n\nLa regué como me dijiste, la puse cerca de la ventana y hasta le hablé un par de veces porque una compañera del trabajo dice que sirve.\n\nSe murió igual.\n\nMe acordé de que cuando era chica vos tenías plantas por todos lados. En la cocina, en el patio, arriba de la heladera. Algunas las habías sacado de gajos que encontrabas caminando.\n\nYo nunca pude mantener viva ninguna.\n\nTampoco aprendí a coser ni a hacer ese budín de mandarina que preparabas los domingos.\n\nA veces me da un poco de tristeza pensar en todas las cosas que sabés hacer y que yo no aprendí.\n\nEl otro día quise arreglar un botón y terminé llevándolo a una modista.\n\nMe cobró una fortuna. Que hija de puta\n\nMe gustaría que algún día me enseñes a hacer el budín.\n\nLo de las plantas ya lo doy por perdido.\n\nEl budín es de caja.\n\nLe pongo ralladura de mandarina para que parezca casero.\n\nNo le digas a tu hermano.","tipo":"Correspondencia ajena","titulo":"La planta"}]</script>

<script>
const NOTAS = (() => { try { return JSON.parse(document.getElementById("notas").textContent); } catch { return []; } })()
  .sort((a, b) => String(b.creado).localeCompare(String(a.creado)));
const BIO = {
  titulo: "Y esta quién es?",
  parrafos: [
    "Una tal que escribe cosas.",
    "Algunas porque me pasan, otras porque me hubiera gustado que me pasaran y unas cuantas porque tengo la mala costumbre de pensar demasiado en asuntos que probablemente no lo merezcan.",
    "Escribo desde hace tiempo. La mayoría de las cosas empiezan en las notas del celular, siguen en algún documento sin título y terminan en un lugar que después no recuerdo. Tengo una cantidad preocupante de archivos que se llaman «final», «final 2» y «ahora sí».",
    "Así que decidí juntarlos acá. No sé si esto cuenta como poner orden, pero al menos ahora puedo perder todo en un mismo lugar.",

// Estadísticas (GoatCounter). MOSTRAR_LECTURAS: true = los lectores ven "Leída N veces" en cada nota.
const GOAT = "https://tengomisrazones.goatcounter.com";
const MOSTRAR_LECTURAS = false;
const notaPath = (d) => "/nota/" + d.id;

// Cuenta una visita apenas el contador termine de cargar.
const pendientes = [];
function contar(path, title) {
  const fn = () => { try { window.goatcounter.count({ path, title }); } catch {} };
  if (window.goatcounter && window.goatcounter.count) fn(); else pendientes.push(fn);
}
window.gcListo = () => { while (pendientes.length) pendientes.shift()(); };

async function lecturas(d, metaRow) {
  try {
    const r = await fetch(GOAT + "/counter/" + encodeURIComponent(notaPath(d)) + ".json");
    if (!r.ok) return;
    const { count } = await r.json();
    if (!count || !metaRow.isConnected) return;
    const n = String(count).replace(/\D/g, "");
    metaRow.insertBefore(el("span", {}, el("b", { textContent: "Leída" }), `${count} ${n === "1" ? "vez" : "veces"}`), metaRow.querySelector(".pill"));
  } catch {}
}

// Buzón: los mensajes van a un Formulario de Google que solo ve la dueña.
// Completar con los datos del formulario (form: el código largo; nombre y mensaje: los "entry.123…").
// nota: el "entry.123…" de la pregunta "Nota" (para los comentarios de cada nota).
const BUZON = { form: "1FAIpQLSeQgP0rdX97oTdVwgmolqHvK_AD8-YVF3IW7KzVjPMSU_jJ1A", nombre: "entry.599544297", mensaje: "entry.625803803", nota: "entry.254648940" };
// Categorías del universo de Una tal_. "Correspondencia ajena" se muestra como hilo de mails.
const TIPO_MAIL = "Correspondencia ajena";
const TIPOS = [TIPO_MAIL, "Estamos hablando de esto otra vez", "Cosas que no mandé", "Tengo mis razones", "Me acuerdo perfectamente", "No era para tanto", "Escuché en la calle", "Leí en algún lado", "Nota del celu", "Me escribieron", "Otro"];
const esMail = (t) => t === TIPO_MAIL || t === "Mail";
const FIRMA = "Escrito por Una Tal, que en su defensa tiene sus razones.";
const MAX_DESTACADOS = 3;

const MIS_MSJ = "buzon-mis-mensajes";
function misMensajes() { try { return JSON.parse(localStorage.getItem(MIS_MSJ) || "[]"); } catch { return []; } }

// Formulario privado. Sin nota: buzón general. Con nota: comentario sobre esa nota.
function buzonForm(nota) {
  const notaId = nota ? nota.id : "", notaTit = nota ? (nota.titulo || "Sin título") : "";
  const nombre = el("input", { type: "text", id: "b-nombre", className: "b-in", placeholder: "Tu nombre (opcional: si no ponés nada, es anónimo)", autocomplete: "off", maxLength: 80 });
  const msj = el("textarea", { id: "b-msj", className: "b-in", placeholder: nota ? "¿Qué te dejó esta nota?" : "Escribí lo que quieras…", rows: 4, maxLength: 3000 });
  const estado = el("p", { className: "b-estado", "aria-live": "polite" });
  const enviar = el("button", { type: "submit", className: "share", textContent: "Enviar" });
  const mios = el("div", { className: "b-mios" });
  const pintarMios = () => {
    const l = misMensajes().filter(m => (m.notaId || "") === notaId);
    mios.replaceChildren(...(l.length ? [el("p", { className: "b-mios-t", textContent: "Lo que dejaste (solo lo ves vos, en este dispositivo)" }),
      ...l.slice(-5).reverse().map(m => el("div", { className: "b-mio" }, el("span", { className: "b-mio-f", textContent: fmtFecha(m.fecha) + (m.nombre ? " · " + m.nombre : " · anónimo") }), el("span", { textContent: m.mensaje })))] : []));
  };
  const form = el("form", { className: "buzon" },
    el("label", { htmlFor: "b-nombre", className: "sr", textContent: "Tu nombre (opcional)" }), nombre,
    el("label", { htmlFor: "b-msj", className: "sr", textContent: "Tu mensaje" }), msj,
    el("div", { className: "b-pie" }, enviar, estado), mios);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const texto = msj.value.trim(); if (!texto) { estado.textContent = "Escribí algo antes de enviar."; return; }
    enviar.disabled = true; estado.textContent = "Enviando…";
    try {
      const body = new URLSearchParams(); body.append(BUZON.mensaje, texto); if (BUZON.nombre) body.append(BUZON.nombre, nombre.value.trim());
      if (BUZON.nota) body.append(BUZON.nota, nota ? notaTit + " (" + location.origin + location.pathname + "#" + notaId + ")" : "Buzón general");
      await fetch("https://docs.google.com/forms/d/e/" + BUZON.form + "/formResponse", { method: "POST", mode: "no-cors", body });
      const l = misMensajes(); l.push({ fecha: new Date().toISOString(), nombre: nombre.value.trim(), mensaje: texto, notaId });
      try { localStorage.setItem(MIS_MSJ, JSON.stringify(l.slice(-20))); } catch {}
      msj.value = ""; estado.textContent = "Llegó. Gracias."; pintarMios();
    } catch { estado.textContent = "No se pudo enviar. Revisá la conexión y probá de nuevo."; }
    enviar.disabled = false;
  };
  pintarMios();
  return form;
}

function buzonBlock() {
  if (!BUZON.form || !BUZON.mensaje) return null;
  return el("div", { className: "blk blk-buzon", id: "buzon" },
    el("p", { className: "sect", textContent: "Dejame un mensaje" }),
    el("p", { className: "b-nota", textContent: "Lo leo solo yo. Podés firmarlo o dejarlo anónimo." }), buzonForm(null));
}

function comentariosBlock(d) {
  if (!BUZON.form || !BUZON.mensaje) return null;
  return el("section", { className: "comentarios", "aria-label": "Comentarios" },

    el("p", { className: "b-nota", textContent: "Lo que escribas acá lo leo solo yo. Podés firmarlo o dejarlo anónimo." }), buzonForm(d));
}
const state = { filtro: "Todos", q: "" };
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === "style" || k.startsWith("aria-")) n.setAttribute(k, v); else n[k] = v; } for (const k of kids) if (k != null && k !== false) n.append(k); return n; };
const words = (s) => (s || "").trim().split(/\s+/).filter(Boolean).length;
const mins = (s) => Math.max(1, Math.round(words(s) / 200));
const fmtFecha = (iso) => { try { return new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" }); } catch { return ""; } };
const excerpt = (s, n = 230) => { const t = (s || "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n).replace(/\s\S*$/, "") + "…" : t; };
const pad = (n) => String(n).padStart(2, "0");
const href = (d) => "#" + encodeURIComponent(d.id);

function meta(d) {
  return el("div", { className: "meta" },
    el("span", {}, el("b", { textContent: "Categoría" }), d.tipo || "Otro"),
    el("span", {}, el("b", { textContent: "Fecha" }), fmtFecha(d.creado)),
    el("span", {}, el("b", { textContent: "Lectura" }), mins(d.texto) + " min"),
    el("span", { className: "pill", textContent: d.tipo || "Otro" }));
}

function ticker() {
  const items = NOTAS.slice(0, 8);
  const run = () => el("div", { className: "run" }, ...(items.length ? items.map(d => el("a", { href: href(d), textContent: d.titulo || "Sin título" })) : [el("span", { textContent: "Muy pronto, las primeras notas" })]));
  return el("div", { className: "ticker", "aria-label": "Últimas notas" }, el("span", { className: "lab", textContent: "Últimas notas+++" }), el("div", { className: "vp" }, el("div", { className: "track" }, run(), run())));
}

// Mueve la franja de a poquito. Si alguien la toca o pasa el mouse, se frena y retoma sola.
function startTicker() {
  const vp = document.querySelector(".ticker .vp"); if (!vp) return;
  // Repite los títulos hasta llenar el ancho, así la vuelta no se nota en pantallas grandes.
  const track = vp.querySelector(".track"), r0 = track && track.children[0];
  if (r0 && r0.offsetWidth > 0) {
    const orig = [...r0.children]; let guard = 0;
    const need = Math.max(vp.clientWidth, window.screen && window.screen.width || 0, window.innerWidth) + 20;
    while (r0.offsetWidth < need && guard++ < 30) orig.forEach(c => r0.append(c.cloneNode(true)));
    track.replaceChildren(r0, r0.cloneNode(true));
  }
  let pos = 0, paused = false, t;
  const pause = () => { paused = true; clearTimeout(t); };
  const resume = () => { clearTimeout(t); t = setTimeout(() => { pos = vp.scrollLeft; paused = false; }, 2500); };
  vp.addEventListener("touchstart", pause, { passive: true });
  vp.addEventListener("touchend", resume, { passive: true });
  vp.addEventListener("mouseenter", pause);
  vp.addEventListener("mouseleave", resume);
  vp.addEventListener("wheel", () => { pause(); resume(); }, { passive: true });
  let last = performance.now();
  const step = (now) => {
    if (!vp.isConnected) return;
    const dt = Math.min(now - last, 64); last = now;
    const half = vp.scrollWidth / 2;
    if (!paused && half > vp.clientWidth / 2) {
      pos += dt * 0.035;
      if (pos >= half) pos -= half;
      vp.scrollLeft = pos;
    } else if (paused && vp.scrollLeft >= half) {
      vp.scrollLeft -= half;
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return NOTAS.filter(d => (state.filtro === "Todos" || d.tipo === state.filtro) && (!q || (d.titulo || "").toLowerCase().includes(q) || (d.texto || "").toLowerCase().includes(q)));
}

function renderList() {
  const list = $("list"); const items = filtered();
  list.replaceChildren(...items.map(d => el("article", { className: "row" },

    el("div", { style: "min-width:0" }, el("h3", {}, el("a", { href: href(d), textContent: d.titulo || "Sin título" })), d.bajada ? el("p", { textContent: d.bajada }) : null, meta(d)))));
  if (!NOTAS.length) list.append(el("div", { className: "note", textContent: "Todavía no hay notas publicadas." }));
  else if (!items.length) list.append(el("div", { className: "note", textContent: "Ninguna nota coincide con esa búsqueda." }));
}

function renderHome(v) {
  document.title = "Una tal_";
  const kids = [el("h1", { className: "mast" }, el("a", { href: "#sobre", title: "Y esta quién es?" }, "Una tal", el("span", { className: "cursor", textContent: "_" }))), ticker()];
  const lead = NOTAS[0];
  kids.push(lead

function renderRead(v, d) {
  document.title = (d.titulo || "Sin título") + " — Una tal_";
  const metaRow = meta(d); metaRow.classList.add("metarow");
  if (MOSTRAR_LECTURAS) lecturas(d, metaRow);
  v.replaceChildren(el("article", { className: "article" },

    el("h2", { textContent: d.titulo || "Sin título" }), metaRow,

    el("div", { className: "firma" }, el("span", { textContent: "Una tal_" }), shareBtn(d)),
    comentariosBlock(d),
    prevNext(d)));
}

function shareBtn(d) {
  const url = location.origin + location.pathname + "#" + encodeURIComponent(d.id);
  const b = el("button", { type: "button", className: "share", textContent: "Copiar link de esta nota" });
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(url); b.textContent = "¡Link copiado!"; }
    catch { b.textContent = url; }
    setTimeout(() => { b.textContent = "Copiar link de esta nota"; }, 2500);
  };
  return b;
}

function prevNext(d) {
  const i = NOTAS.indexOf(d), older = NOTAS[i + 1], newer = NOTAS[i - 1];
  if (!older && !newer) return null;
  const cell = (n, label, cls) => n
    ? el("a", { className: "pn " + cls, href: href(n) }, el("span", { className: "pn-k", textContent: label }), el("span", { className: "pn-t", textContent: n.titulo || "Sin título" }))
    : el("span");
  return el("nav", { className: "prevnext", "aria-label": "Otras notas" }, cell(older, "← Nota anterior", "izq"), cell(newer, "Nota siguiente →", "der"));
}

const isThread = (d) => esMail(d.tipo) &&Array.isArray(d.mails) && d.mails.length > 0;
function asuntos(base, mails) {
  const out = []; let prev = (base || "").trim() || "Sin asunto";
  mails.forEach((m, i) => { const own = typeof m.asunto === "string" && m.asunto.trim(); const s = i === 0 ? prev : (own || "Re: " + prev); out.push(s); prev = s; });
  return out;
}

  const subs = asuntos(d.titulo, d.mails);
  return el("div", { className: "thread" },
    el("p", { className: "thread-count", textContent: `Hilo · ${d.mails.length} ${d.mails.length === 1 ? "mail" : "mails"}` }),

        el("div", { className: "mail-who" },
          el("div", { className: "mail-from" }, el("span", { className: "k", textContent: "De:" }), m.de || "Sin remitente"),
          el("div", { className: "mail-to" }, el("span", { className: "k", textContent: "Para:" }), m.para || "—"),
          el("div", { className: "mail-asunto" }, el("span", { className: "k", textContent: "Asunto:" }), subs[i])),
        el("span", { className: "mail-date", textContent: m.fecha || "" })),
      el("div", { className: "mail-body", textContent: m.cuerpo || "" }))));
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const d = id && NOTAS.find(n => n.id === id);
  if (id === "sobre") { renderSobre($("view")); contar("/sobre", "Sobre Una tal_"); }
  else if (d) { renderRead($("view"), d); contar(notaPath(d), d.titulo || "Sin título"); }
  else { renderHome($("view")); contar("/", "Portada"); }
  window.scrollTo({ top: 0 });
}

function renderSobre(v) {
  document.title = "Sobre Una tal_";
  v.replaceChildren(el("article", { className: "article sobre" },
    el("div", { className: "top" }, el("a", { href: "#", textContent: "← Todas las notas" }), el("span", { className: "pill", textContent: "Sobre Una tal_" })),
    el("h2", { textContent: BIO.titulo }),

const total = NOTAS.reduce((a, d) => a + words(d.texto), 0);
$("stats").textContent = NOTAS.length ? `${NOTAS.length} ${NOTAS.length === 1 ? "nota" : "notas"} · ${total.toLocaleString("es-AR")} palabras` : "";

const PALETAS = ["clasica", "cafe", "terracota", "rojo", "azul"];
function setPaleta(p) {

  document.querySelectorAll(".sw[data-p]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === p)));
